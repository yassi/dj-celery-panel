name: Tests

on: [push]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 4.2 — Python 3.9–3.12
          - python-version: "3.9"
            django-version: "4.2"
          - python-version: "3.10"
            django-version: "4.2"
          - python-version: "3.11"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "4.2"
          # Django 5.2 — Python 3.10–3.14
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "5.2"
          # Django 6.0 — Python 3.12–3.14
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"
          # Django 6.1 — Python 3.12–3.14
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "6.1"

    services:
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
            make install
            pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run database migrations
        run: |
            cd example_project
            python manage.py migrate --noinput
        env:
          DB_ENGINE: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Start Celery worker
        run: |
            cd example_project
            celery -A example_project worker --loglevel=info --detach --logfile=celery_worker.log
        env:
          DB_ENGINE: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Wait for worker to be ready
        run: |
            echo "Waiting for Celery worker to register..."
            sleep 5

      - name: Run tests with coverage
        run: |
            pytest --cov=dj_celery_panel --cov-report=xml
        env:
          TEST_DB_BACKEND: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Show Celery worker logs on failure
        if: failure()
        run: |
            echo "=== Celery Worker Logs ==="
            cat example_project/celery_worker.log || echo "No worker log file found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests,python-${{ matrix.python-version }},django-${{ matrix.django-version }}
          fail_ci_if_error: true
